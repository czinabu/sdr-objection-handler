<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objection Handler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="list">
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Objection Handler</h1>
      <div class="mode" role="radiogroup" aria-label="Call type">
        <button type="button" role="radio" data-mode="inside" aria-checked="true">Inside <span>Rehash · transfer</span></button>
        <button type="button" role="radio" data-mode="field" aria-checked="false">Field <span>appointment</span></button>
      </div>
      <button type="button" id="new-call" class="ghost" title="Clear everything for the next call (Esc twice)">New call</button>
    </div>
    <div class="searchbar">
      <input id="search" type="search" placeholder="Type what they said… spouse, price, busy" autocomplete="off" spellcheck="false" autofocus aria-label="Search objections">
    </div>
  </header>

  <main class="layout">
    <nav class="list" id="list" aria-label="Objections"></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>

  <footer class="keys">
    <span><kbd>1</kbd>–<kbd>9</kbd> quick picks</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>Enter</kbd> keep open</span>
    <span><kbd>Esc</kbd> clear · twice for new call</span>
    <span><kbd>/</kbd> search</span>
  </footer>

  <script src="data/objections.js"></script>
  <script src="app.js"></script>
</body>
</html>
